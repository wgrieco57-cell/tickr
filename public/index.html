<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><path d='M20 50h15m10 0h15m10 0h15' stroke='%2322c55e' stroke-width='12' stroke-linecap='round'/><text x='50' y='70' font-family='system-ui, sans-serif' font-size='36' font-weight='900' fill='%2322c55e' text-anchor='middle'>TD</text></svg>">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>TickrDaily</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- FORCE MOBILE PERFECTION – !important beats inline styles -->
    <style>
      body, #root { margin:0; padding:0; min-height:100dvh; font-family:'Inter',system-ui; }
      
      /* QUOTRON – ONLY AS TALL AS THE TEXT */
      .quotron-container {
        all: unset !important;
        height: auto !important;
        min-height: 42px !important;
        padding: 8px 0 !important;
        margin: 4px 12px 8px !important;
        overflow: hidden !important;
        background: rgba(15,23,42,0.9) !important;
        border-radius: 12px !important;
      }
      .quotron-scroll {
        animation: scroll 80s linear infinite !important;
        padding-left: 100% !important;
        gap: 2.5rem !important;
        font-size: 0.92rem !important;
        font-weight: 700 !important;
        font-family: 'Courier New', monospace !important;
        color: #22c55e !important;
      }

      @media (max-width: 768px) {
        h1 { font-size: 2.6rem !important; margin: 8px 0 4px !important; }
        .header-date, .live-stats { font-size: 0.85rem !important; margin: 4px 0 !important; }

        /* Kill all giant margins/padding from React inline styles */
        div, section, main, header, footer {
          margin: 0 !important;
          padding: 0 12px !important;
        }
        button, select, input {
          width: calc(100% - 24px) !important;
          margin: 8px 12px !important;
          padding: 16px !important;
          font-size: 1.1rem !important;
          border-radius: 14px !important;
        }

        /* Question cards – no overflow ever */
        [class*="card"], [class*="question"] {
          margin: 8px 12px !important;
          padding: 16px !important;
          border-radius: 14px !important;
          box-sizing: border-box !important;
        }
      }

      @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    </style>
  </head>
  <body>
    <noscript>You need JavaScript to play.</noscript>
    <div id="root"></div>
  </body>
</html>
