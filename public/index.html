<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
   
    <!-- TickrDaily Favicon (copy-paste SVG – no download needed) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><path d='M20 50h15m10 0h15m10 0h15' stroke='%2322c55e' stroke-width='12' stroke-linecap='round'/><text x='50' y='70' font-family='system-ui, sans-serif' font-size='36' font-weight='900' fill='%2322c55e' text-anchor='middle'>TD</text></svg>">
   
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="TickrDaily – Guess the stock ticker from 5 clues. A daily Wordle-style game for finance fans." />
   
    <!-- Apple touch icon & PWA -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <title>TickrDaily – Daily Stock Ticker Guessing Game</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- MOBILE FIXES + BEAUTIFUL QUOTRON (only addition) -->
    <style>
      body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; }

      /* Quotron ticker – looks perfect on all devices */
      .quotron-container {
        overflow: hidden;
        padding: 0.6rem 0;
        border-radius: 1rem;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(15,23,42,0.9);
        margin: 0 1rem 1.5rem 1rem;
        backdrop-filter: blur(8px);
      }
      .quotron-scroll {
        display: flex;
        gap: 2.5rem;
        white-space: nowrap;
        animation: scroll 100s linear infinite;
      }
      .quotron-scroll span {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        font-size: 0.85rem;
        color: #22c55e;
      }
      .quotron-scroll span.negative { color: #ef4444; }

      /* Mobile overrides – everything becomes perfect on phones */
      @media (max-width: 768px) {
        h1 { font-size: 2.6rem !important; }
        .header-date { font-size: 0.8rem !important; }
        .live-stats { font-size: 0.9rem !important; margin: 0.75rem 0 !important; }

        /* Stack buttons vertically & full width */
        .mode-buttons,
        .action-buttons {
          flex-direction: column !important;
          gap: 0.75rem !important;
        }
        .mode-buttons button,
        .action-buttons button,
        select {
          width: 100% !important;
          padding: 1rem !important;
          margin: 0 !important;
        }

        input[type="text"] {
          font-size: 1.1rem !important;
          padding: 1rem !important;
        }

        /* Reduce padding on main content */
        .main-container { padding: 1rem 0.75rem !important; }
      }

      @media (max-width: 480px) {
        .quotron-container { height: 100px; }
        .quotron-scroll {
          flex-direction: column;
          animation: scroll-vertical 80s linear infinite;
          gap: 1.2rem;
        }
      }

      @keyframes scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      @keyframes scroll-vertical {
        from { transform: translateY(100%); }
        to { transform: translateY(-100%); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
